# BIGTREETECH SKR mini E3 v3.0 / Sprite Direct Drive / CR-Touch / KAMP Config
# Big Ol' ButtHole

#######################################################################
# File Inclusions & Core Features
#######################################################################
[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[include mainsail.cfg]
[include timelapse.cfg]
[include KAMP_Settings.cfg]
[include KAMP/Smart_Park.cfg]

[pause_resume]
[respond]
[exclude_object]
[skew_correction]

#######################################################################
# Probe & Homing
#######################################################################
[bltouch]
sensor_pin: ^PC14 
control_pin: PA1  
x_offset: -30     
y_offset: -40     
speed: 20.0
lift_speed: 20.0
samples: 1
samples_result: median
pin_up_touch_mode_reports_triggered: False 
pin_up_reports_not_triggered: True
stow_on_each_sample: False
probe_with_touch_mode: True

[safe_z_home]
home_xy_position: 147.5, 157.5 # Dead center of 235x235 bed factoring in probe offsets
speed: 100
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 200, 195
probe_count: 7, 7
algorithm: bicubic
bicubic_tension: 0.2
#fade_start: 1.0
#fade_end: 10.0
#fade_target: 0
    
[bed_screws]
screw1: 30, 41
screw2: 200, 40
screw3: 200, 212
screw4: 30, 212

[screws_tilt_adjust]
# Nozzle coordinates so the probe lands over the screws
screw1: 60, 75
screw1_name: front left screw
screw2: 230, 75
screw2_name: front right screw
screw3: 230, 230
screw3_name: back right screw
screw4: 60, 230
screw4_name: back left screw
horizontal_move_z: 10.0
speed: 150.0
screw_thread: CW-M4 # Ender 3 uses clockwise M4 bed screws

#######################################################################
# Extruder & Retraction (Sprite Direct Drive)
#######################################################################
[firmware_retraction]
retract_length: 0.6
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 32 # Increased to 32 for smoother extrusion
rotation_distance: 7.535
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 285
max_extrude_only_distance: 120
max_extrude_cross_section: 5
pressure_advance: 0.080
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
interpolate: False
stealthchop_threshold: 0 # Forces SpreadCycle for snappy direct-drive retractions

#######################################################################
# Stepper Motors (X, Y, Z)
#######################################################################
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.700
interpolate: False
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 245
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.700
interpolate: False
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop 
position_min: -5 
position_max: 250

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

#######################################################################
# Heaters, Fans, & System
#######################################################################
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5400320005504E5238363120-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4000
max_z_velocity: 10
max_z_accel: 100

#######################################################################
# Resonance Testing / Input Shaper / Shake Tune
#######################################################################
[input_shaper]
shaper_freq_x: 56.6
shaper_type_x: mzv
shaper_freq_y: 32.0
shaper_type_y: mzv

#[mcu rpi]
#serial: /tmp/klipper_host_mcu

#[adxl345]
#cs_pin: rpi:None
#spi_bus: spidev0.0

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    115, 115, 20  # Center of Ender 3 bed

#[shaketune]

#######################################################################
# Display & Board Pins
#######################################################################
[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

#######################################################################
# Macros
#######################################################################
[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    
    # Absolute positioning & relative extrusion
    G90
    M83 

    # Start heating bed and nozzle to target temps simultaneously
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    
    # Home all axes while heating to save time
    G28 
    
    # Wait for both bed and nozzle to reach target temperatures
    M190 S{BED_TEMP} 
    M109 S{EXTRUDER_TEMP} 
    
    # KAMP Adaptive Mesh
    BED_MESH_CALIBRATE
	SMART_PARK
    SKEW_PROFILE LOAD=my_skew_profile
    M118 Skew Profile Loaded!
    
    LINE_PURGE

[gcode_macro PRINT_END]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M107

    # Relative positioning
    G91

    # Retract filament to prevent stringing and raise Z 5mm (safe clearance)
    G1 E-2 F2700
    G1 Z5 F3000

    # Absolute positioning
    G90

    # Present print (Move toolhead out of the way and push bed forward)
    G1 X5 Y230 F6000

    # Disable steppers (Except Z, to prevent the gantry from sagging)
    M84 X Y E

    # Clear skew profile
    SET_SKEW CLEAR=1

	# Trigger GitHub Backup
    BACKUP_CFG

[gcode_shell_command backup_cfg]
command: ~/Klipper-Backup/wrapper.sh
timeout: 90.0
verbose: True

[gcode_macro BACKUP_CFG]
description: Backs up Klipper configs to GitHub
gcode:
    {% set message = params.MESSAGE|default('') %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=backup_cfg PARAMS="{message}"
    {% else %}
        RUN_SHELL_COMMAND CMD=backup_cfg
    {% endif %}

